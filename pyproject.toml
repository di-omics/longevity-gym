[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longevity-rl"
version = "0.1.0"
description = "Synthetic benchmarks for few-shot batch selection and aging-clock interpretation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Di Hu"}]
license = "MIT"
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/di-omics/longevity-rl"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
longevity-rl = "longevityrl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/longevityrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
